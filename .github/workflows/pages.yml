name: Build, check exports, and publish documentation

on:
  push:
    branches: [main]

# Queue pushes so each build and deployment can finish.
concurrency:
  group: main-pages
  queue: max

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Make room for the PRA exports
        # The exports alone take about 18 GiB on the hosted runner.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup

      - name: Build the Lean library and its PRA exports
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: 'false'
          build: 'true'
          build-args: PRAProver
          use-github-cache: 'false'
          use-mathlib-cache: 'false'

      - name: Verify all PRA exports with the Rust checker
        run: >-
          cargo run --locked --release --manifest-path checker/Cargo.toml --
          .lake/build/pra --max-record-mib 4096

      - name: Generate documentation
        run: |
          rm -rf .lake/build/pra
          lake build PRAProver:docs
          test -s .lake/build/doc/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
